name: Build APK

on:
  push:
    branches:
      - "**"
    tags:
      - v*
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Validate release content
        run: python3 scripts/validate_release_content.py

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "HAS_GOOGLE_SERVICES=false" >> "$GITHUB_ENV"
            echo "GOOGLE_SERVICES_JSON_BASE64 is not configured; using a CI-only Firebase placeholder for compile checks."
            mkdir -p app
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "org.levimc.launcher"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCIOnlyPlaceholderKey"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
            exit 0
          fi

          mkdir -p app
          printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" | base64 --decode > app/google-services.json
          python3 -m json.tool app/google-services.json > /dev/null
          python3 - <<'PY'
          import json
          import sys

          expected = "org.levimc.launcher"
          with open("app/google-services.json", encoding="utf-8") as fp:
              data = json.load(fp)

          package_names = {
              client.get("client_info", {})
              .get("android_client_info", {})
              .get("package_name")
              for client in data.get("client", [])
          }
          if expected not in package_names:
              actual = ", ".join(sorted(name for name in package_names if name)) or "<none>"
              print(
                  f"google-services.json package_name mismatch: expected {expected}, got {actual}",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
          echo "HAS_GOOGLE_SERVICES=true" >> "$GITHUB_ENV"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Licenses
        run: yes | sdkmanager --licenses

      - name: Install Build Tools 35.0.0
        run: sdkmanager "build-tools;35.0.0"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-ci"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Inject API Keys
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: echo "curseforge.api_key=${CF_API_KEY}" >> local.properties

      - name: Build Debug, Beta and Release APKs
        run: ./gradlew assembleDebug assembleBeta assembleRelease

      - name: Prepare signing keystore
        id: keystore
        env:
          SIGNING_KEY_STORE: ${{ secrets.SIGNING_KEY_STORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "${SIGNING_KEY_STORE:-}" ] && [ -n "${SIGNING_KEY_ALIAS:-}" ]; then
            printf '%s' "$SIGNING_KEY_STORE" | base64 --decode > "$KS"
            echo "alias=${SIGNING_KEY_ALIAS}" >> "$GITHUB_OUTPUT"
            echo "store_password=${SIGNING_STORE_PASSWORD}" >> "$GITHUB_OUTPUT"
            echo "key_password=${SIGNING_KEY_PASSWORD}" >> "$GITHUB_OUTPUT"
            echo "source=secret" >> "$GITHUB_OUTPUT"
          else
            ALIAS="ci"
            PASS="cipassword"
            keytool -genkeypair -v \
              -keystore "$KS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=US"
            echo "alias=${ALIAS}" >> "$GITHUB_OUTPUT"
            echo "store_password=${PASS}" >> "$GITHUB_OUTPUT"
            echo "key_password=${PASS}" >> "$GITHUB_OUTPUT"
            echo "source=generated" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing keystore secrets are not configured; signed with a temporary CI keystore."
          fi
          echo "path=${KS}" >> "$GITHUB_OUTPUT"

      - name: Zipalign and sign release APK
        env:
          KS: ${{ steps.keystore.outputs.path }}
          ALIAS: ${{ steps.keystore.outputs.alias }}
          STORE_PASS: ${{ steps.keystore.outputs.store_password }}
          KEY_PASS: ${{ steps.keystore.outputs.key_password }}
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          UNSIGNED=$(ls app/build/outputs/apk/release/*-unsigned.apk 2>/dev/null | head -1 || true)
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
          fi
          ALIGNED="$RUNNER_TEMP/release-aligned.apk"
          OUT="$RUNNER_TEMP/Levilauncher-release.apk"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" \
            --out "$OUT" "$ALIGNED"
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "SIGNED_APK=$OUT" >> "$GITHUB_ENV"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketCosmosLevi-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketCosmosLevi-beta-apk
          path: app/build/outputs/apk/beta/*.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketCosmosLevi-release-apk
          path: ${{ env.SIGNED_APK }}

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/render_release_notes.py resources/launcher/changelog.json release-notes.md

      - name: Publish release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SIGNED_APK }}
          body_path: release-notes.md
          name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
